<div class="dashboard-page-wrapper py-3 px-lg-4">
  
  <!-- Loading spinner -->
  <div *ngIf="isLoading" class="text-center my-4">
    <div class="spinner-border text-primary" role="status">
      <span class="sr-only">Loading store environment...</span>
    </div>
  </div>

  <div *ngIf="!isLoading">
    
    <!-- Dashboard Top Bar -->
    <div class="dashboard-topbar glass-panel p-3 mb-4 d-flex flex-wrap justify-content-between align-items-center">
      <div class="d-flex align-items-center mb-2 mb-sm-0">
        <div class="topbar-icon mr-3">
          <i class="fa fa-shopping-bag text-white"></i>
        </div>
        <div>
          <h4 class="mb-0 text-white font-weight-bold">E-MART Catalog & Store</h4>
          <span class="text-muted small">
            Logged in as <strong class="text-white">{{ user?.fname }} {{ user?.lname }}</strong>
            <span *ngIf="user?.role" class="badge badge-warning ml-2">Administrator Panel Active</span>
          </span>
        </div>
      </div>

      <div class="d-flex align-items-center">
        <!-- Cart Toggle Button -->
        <button class="btn btn-warning px-3 shadow-glow" (click)="isSidenavOpen = !isSidenavOpen">
          <i class="fa fa-shopping-basket mr-1"></i>
          <span>{{ isSidenavOpen ? 'Hide Cart' : 'Show Cart' }}</span>
          <span *ngIf="user?.cart?.items?.length > 0" class="badge badge-dark ml-2">
            {{ user?.cart?.items?.length }}
          </span>
        </button>
      </div>
    </div>

    <!-- Main Workspace: Products Grid + Sidebar -->
    <div class="row">
      
      <!-- Catalog Section -->
      <div [ngClass]="isSidenavOpen ? 'col-lg-8 col-xl-9' : 'col-12'" class="transition-all">
        <div class="catalog-card-container glass-panel p-3 p-lg-4 mb-4">
          <app-products [user]="user"></app-products>
        </div>
      </div>

      <!-- Right Drawer / Sidenav (Cart or Admin Form) -->
      <div *ngIf="isSidenavOpen" class="col-lg-4 col-xl-3">
        <div class="sidebar-wrapper glass-panel p-3 mb-4 sticky-top" style="top: 80px; z-index: 1000;">
          <div class="d-flex justify-content-between align-items-center mb-2 pb-2 border-bottom border-secondary">
            <h6 class="mb-0 text-white font-weight-bold">
              <i [class]="user?.role ? 'fa fa-cog text-warning mr-1' : 'fa fa-shopping-cart text-accent mr-1'"></i>
              {{ user?.role ? 'Admin Controls' : 'My Shopping Cart' }}
            </h6>
            <button class="btn btn-sm btn-dark p-1 px-2" (click)="isSidenavOpen = false" title="Collapse panel">
              <i class="fa fa-times"></i>
            </button>
          </div>

          <app-sidebar [user]="user"></app-sidebar>
        </div>
      </div>

    </div>

  </div>

</div>

<!-- ERROR / NOTIFICATION MODAL -->
<div class="modal" id="dashboardModal" [ngStyle]="{ display: display }">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title text-white" [innerHTML]="modalHeader ? modalHeader : 'Notification'"></h5>
        <button type="button" (click)="onCloseHandled()" class="close" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body" *ngIf="modalBody" [innerHTML]="modalBody"></div>
      <div class="modal-footer">
        <button type="button" (click)="onCloseHandled()" class="btn btn-danger" routerLink="/">
          Close
        </button>
      </div>
    </div>
  </div>
</div>
