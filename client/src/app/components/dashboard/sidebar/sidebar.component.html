<div class="sidebar-inner">
  <!-- Spinner -->
  <div *ngIf="isLoading" class="text-center my-3">
    <div class="spinner-border spinner-border-sm text-primary" role="status">
      <span class="sr-only">Loading sidebar...</span>
    </div>
  </div>

  <!-- Regular Shopper: Cart Component -->
  <app-cart *ngIf="!user?.role" [user]="user"></app-cart>

  <!-- Store Administrator: Admin Controls Component -->
  <app-admin-form *ngIf="user?.role"></app-admin-form>
</div>
