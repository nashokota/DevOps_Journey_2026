<div class="cart-container">
  
  <!-- Back to shop header if in checkout mode -->
  <div *ngIf="user?.cart?.items?.length > 0 && isOrdered" class="mb-3">
    <button (click)="onBackToShop()" class="btn btn-outline-light btn-sm btn-block">
      <i class="fa fa-chevron-left mr-1"></i> Back to Product Catalog
    </button>
  </div>

  <!-- Loading spinner -->
  <div *ngIf="isLoading" class="text-center my-3">
    <div class="spinner-border spinner-border-sm text-primary" role="status">
      <span class="sr-only">Updating cart...</span>
    </div>
  </div>

  <!-- Search input inside cart when in checkout mode -->
  <div *ngIf="isOrdered" class="mb-3">
    <div class="input-group input-group-sm">
      <input
        type="text"
        name="search"
        class="form-control"
        placeholder="Filter items in order..."
        [(ngModel)]="filteredStatus"
      />
    </div>
  </div>

  <!-- Empty Cart State -->
  <div class="empty-cart-alert text-center p-4 rounded mb-3" *ngIf="!user?.cart?.items || user?.cart?.items?.length == 0">
    <div class="empty-cart-icon mb-2">
      <i class="fa fa-shopping-basket text-muted fa-2x"></i>
    </div>
    <h6 class="text-white font-weight-bold mb-1">Your Cart is Empty</h6>
    <p class="text-muted small mb-0">Browse our catalog and pick something special!</p>
  </div>

  <!-- Error banner -->
  <div class="alert alert-danger alert-dismissible fade show p-2 mb-3" *ngIf="isError">
    <small><i class="fa fa-exclamation-circle mr-1"></i> {{ errorBody }}</small>
    <button type="button" class="close p-2" (click)="isError = false">&times;</button>
  </div>

  <!-- Items list in Cart -->
  <div *ngIf="user?.cart?.status !== 'closed' && user?.cart?.items?.length > 0" class="cart-items-scroll mb-3">
    
    <div class="d-flex justify-content-between align-items-center mb-2">
      <span class="text-muted small font-weight-bold">ITEMS ({{ user?.cart?.items?.length }})</span>
      
      <!-- Empty cart button -->
      <button
        *ngIf="!isOrdered && user?.cart?.status !== 'pending'"
        (click)="onEmptyCart()"
        class="btn btn-link btn-sm text-danger p-0 small"
        title="Remove all items"
      >
        <i class="fa fa-trash-o mr-1"></i> Clear Cart
      </button>
    </div>

    <ul class="list-unstyled cart-items-list mb-0">
      <li *ngFor="let item of user?.cart?.items" class="cart-item-row p-2 mb-2 rounded">
        <div class="d-flex align-items-center justify-content-between">
          <div class="cart-item-info mr-2">
            <div class="cart-item-name font-weight-bold text-white small" [innerHTML]="item.prod_name | highlight: filteredStatus"></div>
            <div class="d-flex align-items-center gap-2 mt-1">
              <span class="badge badge-dark">Qty: {{ item.quantity }}</span>
              <span class="text-success font-weight-bold small">{{ item.prod_total | currency: "INR":"symbol":"1.2-2" }}</span>
            </div>
          </div>

          <!-- Remove single item button -->
          <div *ngIf="!isOrdered && (user?.cart?.status == 'open' || user?.cart?.status == 'new')">
            <button (click)="onRemoveProductFromCart(item)" class="btn btn-sm btn-dark remove-btn text-danger p-1" title="Remove">
              <i class="fa fa-times"></i>
            </button>
          </div>
        </div>
      </li>
    </ul>

  </div>

  <!-- Cart Subtotal & Order trigger -->
  <div *ngIf="user?.cart?.items?.length > 0" class="cart-summary-box p-3 rounded mb-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <span class="text-muted">Total Payable:</span>
      <span class="total-amount text-white font-weight-bold h5 mb-0">
        {{ total | currency: "INR":"symbol":"1.2-2" }}
      </span>
    </div>

    <!-- Proceed to Checkout / Order Button -->
    <div *ngIf="(!isOrdered && user?.cart?.status == 'open') || user?.cart?.status == 'new'">
      <button
        (click)="onOrder()"
        class="btn btn-success btn-block btn-lg shadow-glow font-weight-bold"
        [disabled]="user?.cart?.items?.length == 0"
      >
        <i class="fa fa-credit-card mr-2"></i> Proceed to Checkout
      </button>
    </div>
  </div>

  <!-- Checkout Order Form Component -->
  <app-order-form *ngIf="isOrdered" [user]="user"></app-order-form>

</div>
