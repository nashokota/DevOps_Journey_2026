<div class="admin-panel-container">
  
  <!-- Action header -->
  <div class="admin-header-actions d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom border-secondary">
    <div class="d-flex align-items-center">
      <div class="admin-mode-pill" [ngClass]="mode == 'add' ? 'mode-add' : 'mode-edit'">
        <i [class]="mode == 'add' ? 'fa fa-plus mr-1' : 'fa fa-pencil mr-1'"></i>
        <span>{{ mode == 'add' ? 'New Product' : 'Editing Product' }}</span>
      </div>
      
      <!-- Spinner -->
      <div *ngIf="isLoading" class="spinner-border spinner-border-sm text-warning ml-2" role="status">
        <span class="sr-only">Saving changes...</span>
      </div>
    </div>

    <div>
      <button (click)="onAddProduct()" type="button" class="btn btn-sm btn-dark mr-1" title="Create New Product">
        <i class="fa fa-plus"></i>
      </button>
      <button
        *ngIf="mode == 'edit'"
        (click)="onDeleteProduct()"
        type="button"
        class="btn btn-sm btn-danger"
        title="Delete Current Product"
      >
        <i class="fa fa-trash"></i>
      </button>
    </div>
  </div>

  <div *ngIf="!isHidden">
    
    <!-- Status Alerts -->
    <div *ngIf="isEmpty && !isOK" class="alert alert-danger p-2 mb-3">
      <small><i class="fa fa-exclamation-circle mr-1"></i> {{ warning }}</small>
    </div>
    <div *ngIf="isEmpty && isOK" class="alert alert-success p-2 mb-3">
      <small><i class="fa fa-check-circle mr-1"></i> {{ warning }}</small>
    </div>

    <!-- Product Form -->
    <form #adminForm="ngForm" (ngSubmit)="mode == 'add' ? onSaveNewProduct(adminForm) : onUpdateProduct(adminForm)" class="mb-4">
      
      <!-- Name -->
      <div class="form-group mb-2">
        <label for="prod_name" class="small mb-1">Product Title:</label>
        <input
          type="text"
          name="prod_name"
          class="form-control form-control-sm"
          id="prod_name"
          [(ngModel)]="currentProduct.prod_name"
          #prod_name="ngModel"
          placeholder="e.g. Wireless Mouse"
        />
      </div>

      <!-- Price -->
      <div class="form-group mb-2">
        <label for="price" class="small mb-1">Unit Price (INR):</label>
        <input
          type="number"
          name="price"
          class="form-control form-control-sm"
          id="price"
          [(ngModel)]="currentProduct.price"
          #price="ngModel"
          placeholder="0.00"
        />
      </div>

      <!-- Category Selector -->
      <div class="form-group mb-2">
        <label for="category" class="small mb-1">Category Classification:</label>
        <select
          name="category"
          class="form-control form-control-sm"
          id="category"
          [(ngModel)]="currentProduct.category ? currentProduct.category : initCategory"
          #category="ngModel"
        >
          <option *ngFor="let category of categories" [value]="category?.cat_name">
            {{ category?.cat_name }}
          </option>
        </select>
      </div>

      <!-- Image File Picker -->
      <div class="form-group mb-3">
        <label class="small mb-1">Product Image (.JPEG, .JPG, .PNG):</label>
        <input
          type="file"
          (change)="onFileSelected($event)"
          (click)="onFileSelected($event)"
          style="display:none"
          #pickedFile
        />
        <div class="d-flex align-items-center">
          <button type="button" (click)="pickedFile.click()" class="btn btn-sm btn-dark">
            <i class="fa fa-image mr-1"></i> Choose File
          </button>
          <span class="file-name-label ml-2 small text-muted text-truncate" style="max-width: 150px;">
            {{ selectedFile ? (selectedFile?.name | shorten: 15) : 'No file chosen' }}
          </span>
        </div>
      </div>

      <!-- Submit button -->
      <button type="submit" class="btn btn-primary btn-block btn-sm shadow-glow font-weight-bold">
        <i [class]="mode == 'add' ? 'fa fa-plus-circle mr-1' : 'fa fa-save mr-1'"></i>
        {{ mode == 'add' ? 'Publish Product to Store' : 'Save Product Updates' }}
      </button>

    </form>

    <!-- Category Addition Form Card -->
    <div class="add-cat-card p-3 rounded">
      <h6 class="text-white font-weight-bold mb-2 small">
        <i class="fa fa-folder-plus mr-1 text-accent"></i> Create New Category
      </h6>
      <form #categoryForm="ngForm" (ngSubmit)="onAddCategory(categoryForm)">
        <div class="form-group mb-2">
          <input
            type="text"
            name="category_add"
            id="category_add"
            placeholder="New Category Name..."
            class="form-control form-control-sm"
            [ngClass]="{ 'is-invalid': category_add.errors && category_add.touched }"
            ngModel
            #category_add="ngModel"
            required
            minlength="2"
          />
          <div [hidden]="!category_add.errors?.required || !category_add.touched" class="invalid-feedback small">
            Category name required
          </div>
        </div>
        <button type="submit" class="btn btn-outline-light btn-sm btn-block">
          <i class="fa fa-plus mr-1"></i> Add Category
        </button>
      </form>
    </div>

  </div>

</div>
