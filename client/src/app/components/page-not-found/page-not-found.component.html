<div class="not-found-wrapper py-5 text-center">
  <div class="container">
    <div class="glass-panel p-5 max-w-600 mx-auto">
      
      <div *ngIf="isLoading" class="spinner-border text-primary mb-4" role="status">
        <span class="sr-only">Loading...</span>
      </div>

      <div class="error-code-badge mb-3">404 ERROR</div>
      <h1 class="display-3 font-weight-bold text-white mb-2">Page Not Found</h1>
      
      <div class="my-4">
        <img src="./assets/images/frown-solid.svg" class="img-fluid not-found-img" alt="Page Not Found" />
      </div>

      <p class="text-muted mb-4 lead">
        The destination you requested might have been moved, renamed, or is temporarily unavailable.
      </p>

      <div>
        <a routerLink="/" class="btn btn-primary btn-lg shadow-glow px-4">
          <i class="fa fa-home mr-2"></i> Return to Homepage
        </a>
      </div>

    </div>
  </div>
</div>
